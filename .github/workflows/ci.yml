name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Python unit tests
        run: python -m unittest discover -s turbofetch/tests -v

      - name: Check browser extension syntax
        run: |
          node --check turbofetch/extension/content.js
          node --check turbofetch/extension/background.js
          node --check turbofetch/extension/popup/popup.js
          node --check turbofetch/extension/options/options.js
